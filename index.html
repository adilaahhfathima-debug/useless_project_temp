<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entha Poyaalo?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone-screen splash" id="screen1">
    <h1 class="logo">ENTHA<br>POYAALO?</h1>
    <p class="tagline">Don't just reach.<br>Experience the way 😍</p>

    <div class="signpost left">
      <div class="sign">NATURE</div>
      <div class="sign">CAFÉ</div>
    </div>
    <div class="signpost right">
      <div class="sign">LIFE</div>
      <div class="sign">FUN</div>
      <div class="sign">HOTELS</div>
    </div>

    <button class="btn-primary" id="letsGoBtn">Let's Go!</button>
    <div class="dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

  <div class="phone-screen home hidden" id="screen2">
    <h2 class="app-title">ENTHA<br>POYAALO?</h2>
    <p class="question">Where do we annoy you today? 😆</p>

    <label class="field-label">From</label>
    <input type="text" class="input-box" id="fromInput" placeholder="Thiruvananthapuram">

    <label class="field-label">To</label>
    <input type="text" class="input-box" id="toInput" placeholder="Kollam">

    <button class="btn-outline" id="myLocationBtn">📍 My Location</button>

    <button class="btn-primary" id="planJourneyBtn">Plan My Journey 😎</button>

    <div class="bottom-nav">
      <div class="nav-item active">🏠<br>Home</div>
      <div class="nav-item">🧳<br>Trips</div>
      <div class="nav-item">❤️<br>Favourites</div>
      <div class="nav-item">👤<br>Profile</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
